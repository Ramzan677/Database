<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Data Finder - Ramzan Ahsan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .gradient-card-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-card-2 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
        .gradient-card-3 { background: linear-gradient(135deg, #00dbde 0%, #fc00ff 100%); }
        .data-label { font-weight: 600; color: #475569; font-size: 0.875rem; }
        .data-value { color: #1e293b; font-size: 1rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-white shadow-sm py-6 px-4 text-center">
        <h1 class="text-3xl font-extrabold text-blue-600 tracking-tight">SIM Information Finder</h1>
        <p class="text-gray-500 mt-1 font-medium italic">Developed by Ramzan Ahsan</p>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-2xl">
        <!-- Search Box -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-gray-100">
            <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Enter Mobile Number (e.g., 03036396864)</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="phone" 
                    placeholder="03xxxxxxxxx" 
                    maxlength="11"
                    class="flex-grow px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg"
                >
                <button 
                    onclick="fetchData()" 
                    id="searchBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-md active:scale-95"
                >
                    Search
                </button>
            </div>
            <p id="statusMsg" class="mt-3 text-sm hidden"></p>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-6">
            <!-- Cards will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 text-gray-400">
            <svg class="mx-auto h-12 w-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <p>Enter a number to see results</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-6 px-4 text-center">
        <p class="text-gray-600 font-medium">© 2024 All Rights Reserved</p>
        <p class="text-blue-600 font-bold mt-1">Developed by Ramzan Ahsan</p>
    </footer>

    <script>
        async function fetchData() {
            const input = document.getElementById('phone').value.trim();
            const resultsDiv = document.getElementById('results');
            const statusMsg = document.getElementById('statusMsg');
            const emptyState = document.getElementById('emptyState');
            const searchBtn = document.getElementById('searchBtn');

            if (!input) {
                showStatus("Please enter a mobile number", "text-red-500");
                return;
            }

            // Convert format from 03... to 923...
            let apiNumber = input;
            if (input.startsWith('0')) {
                apiNumber = '92' + input.substring(1);
            }

            // Reset UI
            resultsDiv.innerHTML = '';
            emptyState.classList.add('hidden');
            showStatus("Fetching data...", "text-blue-500");
            searchBtn.disabled = true;
            searchBtn.innerText = "Searching...";

            try {
                const response = await fetch(`https://ramzan-simdata.deno.dev/?number=${apiNumber}`);
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    showStatus(`${result.total_sims_found} Records Found`, "text-green-600");
                    
                    result.data.forEach((item, index) => {
                        const card = createCard(item, index);
                        resultsDiv.appendChild(card);
                    });

                    // Add developed by notice at end of results
                    const creditNote = document.createElement('div');
                    creditNote.className = "text-center py-4 text-gray-400 italic font-medium";
                    creditNote.innerText = "Results provided by " + (result.credit || "Ramzan Ahsan");
                    resultsDiv.appendChild(creditNote);

                } else {
                    showStatus("No data found for this number", "text-orange-500");
                    emptyState.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                showStatus("Error connecting to API. Please try again.", "text-red-500");
                emptyState.classList.remove('hidden');
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerText = "Search";
            }
        }

        function createCard(item, index) {
            const colors = [
                'border-l-blue-500', 
                'border-l-purple-500', 
                'border-l-pink-500', 
                'border-l-emerald-500', 
                'border-l-amber-500'
            ];
            const borderColor = colors[index % colors.length];

            const div = document.createElement('div');
            div.className = `bg-white rounded-2xl shadow-md p-6 border-l-8 ${borderColor} transition-transform hover:scale-[1.01]`;
            
            div.innerHTML = `
                <div class="grid grid-cols-1 gap-1">
                    <div class="mb-4 flex justify-between items-center border-b border-gray-50 pb-2">
                        <span class="bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">Record #${index + 1}</span>
                        <span class="text-blue-600 font-bold">${item.number}</span>
                    </div>

                    <p class="data-label">NAME</p>
                    <p class="data-value font-bold uppercase">${item.name || 'N/A'}</p>

                    <p class="data-label">CNIC</p>
                    <p class="data-value tracking-widest font-mono text-blue-700">${item.cnic || 'N/A'}</p>

                    <p class="data-label">ADDRESS</p>
                    <p class="data-value text-sm leading-relaxed">${item.address || 'N/A'}</p>

                    <div class="mt-4 pt-4 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-[10px] text-gray-400 font-bold uppercase">System: Registered</span>
                        <span class="text-[10px] text-blue-500 font-semibold italic">Dev: ${item.developed_by || 'Ramzan Ahsan'}</span>
                    </div>
                </div>
            `;
            return div;
        }

        function showStatus(msg, colorClass) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerText = msg;
            statusMsg.className = `mt-3 text-sm font-semibold ${colorClass}`;
            statusMsg.classList.remove('hidden');
        }

        // Allow 'Enter' key to trigger search
        document.getElementById('phone').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchData();
            }
        });
    </script>
</body>
</html>
